<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>作品集编辑器｜集页 JIYE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="logo" href="index.html"><span class="ji">集页</span> JIYE <small>PORTFOLIO</small></a>
    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="templates.html">模板</a>
      <a href="works.html" class="active">我的作品集</a>
      <a href="diagnosis.html">AI诊断</a>
      <a href="community.html">消息社区</a>
    </nav>
    <div class="nav-right">
      <a class="btn btn-ghost" href="works.html">← 返回</a>
      <button class="burger">☰</button>
      <a class="btn btn-pink" href="success.html">发布作品</a>
    </div>
  </div>
</header>

<section class="section">
  <div class="wrap editor">
    <!-- 左侧页面大纲 -->
    <aside class="ed-side">
      <h5>页面结构</h5>
      <a class="active" href="#">🏠 Home 首页封面</a>
      <a href="#">🅰️ About 个人介绍</a>
      <a href="#">🗂️ Contents 作品目录</a>
      <a href="#">📄 Project 01</a>
      <a href="#">📄 Project 02</a>
      <a href="#">📄 Project 03</a>
      <a href="#">💌 Contact 联系方式</a>
      <h5>设置</h5>
      <a href="#">🎨 主题风格</a>
      <a href="#">🔗 域名设置</a>
    </aside>

    <!-- 右侧编辑画布 -->
    <div class="ed-canvas">
      <div class="cover">
        <span class="heart">🍒</span>
      </div>
      <div class="field-row">
        <div class="field"><label>作品集标题</label><input value="我的作品集" /></div>
        <div class="field"><label>个性化网址</label><input value="my-portfolio" /></div>
      </div>
      <div class="field"><label>一句话介绍</label><input value="视觉传达设计专业 · 用设计温柔地表达" /></div>
      <div class="field"><label>封面寄语</label><textarea>Create · Design · Share，这里收录了我大学四年最用心的作品。</textarea></div>
      <div class="field-row">
        <div class="field"><label>访问权限</label><input value="🌐 公开（任何人都可以访问）" /></div>
        <div class="field"><label>搜索引擎收录</label><input value="允许被搜索引擎收录" /></div>
      </div>
      <div style="display:flex;gap:12px;margin-top:8px">
        <a class="btn btn-pink" href="diagnosis.html">保存并诊断</a>
        <button class="btn btn-ghost" data-save-toast="预览已在新窗口打开">预览效果</button>
      </div>
    </div>
  </div>
</section>

<footer class="footer" style="margin-top:0">
  <div class="wrap">
    <div class="footer-bottom" style="border:none"><span>© 2026 集页 JIYE · 校园作业演示项目</span><span>Made with 💗 for graduates</span></div>
  </div>
</footer>

<script src="main.js"></script>
</body>
</html>
